<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070d"/>
      <stop offset="100%" stop-color="#121324"/>
    </linearGradient>
    <linearGradient id="monadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#836ef9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="100" fill="url(#bg)"/>
  <rect x="15" y="15" width="470" height="470" rx="85" fill="none" stroke="url(#monadGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Glowing orb in center -->
  <circle cx="250" cy="220" r="130" fill="url(#monadGrad)" filter="url(#glow)"/>

  <!-- Logo Icon -->
  <path d="M 190 280 L 190 160 L 250 225 L 310 160 L 310 280" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monad Names Text -->
  <text x="250" y="395" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    MONAD NAMES
  </text>
  <text x="250" y="435" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#06b6d4" text-anchor="middle" letter-spacing="3">
    .MONAD SERVICE
  </text>
</svg>
